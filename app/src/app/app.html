<header class="app-bar">
  <div class="app-bar-inner">
    <a aria-label="Meter Tracker home" class="brand" routerLink="/">
      <span aria-hidden="true" class="brand-mark">◉</span>
      <span class="brand-text">Meter Tracker</span>
    </a>
    <div class="app-bar-right">
      <nav class="app-nav">
        <a [routerLinkActiveOptions]="{ exact: true }" routerLink="/" routerLinkActive="active"
          >Dashboard</a
        >
        <a routerLink="/meters" routerLinkActive="active">Meters</a>
        <a routerLink="/settings" routerLinkActive="active">Settings</a>
      </nav>
      @if (configured()) {
        <button
          type="button"
          class="sync-chip sync-{{ status() }}"
          [class.sync-attention]="needsAttention()"
          (click)="activate()"
          [disabled]="status() === 'syncing' || status() === 'photos'"
          [title]="
            lastSyncAt() ? 'Last sync: ' + (lastSyncAt() | date: 'medium') : 'Not synced yet'
          "
        >
          <span class="sync-dot" aria-hidden="true"></span>
          <span class="sync-label">{{ statusLabel() }}</span>
        </button>
      }
    </div>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
